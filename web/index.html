<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiyomi — Modern Manga Reader</title>
  <meta name="description" content="Lightweight API-first manga reader and source aggregator platform powered by Go and React.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#09090b">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('kiyomi_theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && systemDark) || (saved === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-background text-foreground">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
