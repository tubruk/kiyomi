coverage:
  status:
    project:
      default:
        target: 30%
      backend:
        flags: [backend]
      frontend:
        flags: [frontend]
    patch: off

flags:
  backend:
    paths:
      - internal/
      - pkg/
      - cmd/
    carryforward: true

  frontend:
    paths:
      - web/src/
    carryforward: true
